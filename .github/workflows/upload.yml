name: Auto YouTube Shorts

on:
  schedule:
    # Morning 10:00 AM IST (04:30 UTC)
    - cron: '30 4 * * *'
    # Evening 10:00 PM IST (16:30 UTC)
    - cron: '30 16 * * *'
  workflow_dispatch:        # Manual run ke liye

permissions:
  contents: write           # Repo mein files save karne ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg, Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          # Thumbnail text ke liye stylish fonts install karte hain
          sudo apt-get install -y fonts-dejavu fonts-liberation

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Create and upload Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'private' }}
          VIDEO_BASE: "Video/Published And Created"
        run: python auto_shorts.py

      - name: Save videos, topics and log to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p "Video/Published And Created/Created" "Video/Published And Created/Published"
          touch used_topics.txt published_log.txt
          git add -A used_topics.txt published_log.txt "Video"
          if ! git diff --staged --quiet; then
            git commit -m "chore: new short + update video folders"
            git pull --rebase
            git push
          fi
